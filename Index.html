<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Interativo & Pedidos</title>
    <style>
        :root {
            --primary: #25D366;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 90px;
        }

        header {
            background-color: var(--dark);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.4rem;
        }

        .categories {
            display: flex;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .category-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .product-info h3 {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .product-info p {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .product-price {
            font-weight: bold;
            color: #16a34a;
        }

        .add-btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Cart Floating Footer */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
        }

        .checkout-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal Checkout */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        .send-order-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="store-title">Minha Loja Digital</h1>
    </header>

    <!-- Filtro de Categorias -->
    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('todos')">Todos</button>
        <button class="category-btn" onclick="filterCategory('Lanches')">Lanches</button>
        <button class="category-btn" onclick="filterCategory('Bebidas')">Bebidas</button>
        <button class="category-btn" onclick="filterCategory('Sobremesas')">Sobremesas</button>
    </div>

    <!-- Lista de Produtos -->
    <div class="container">
        <div class="products-grid" id="products-container"></div>
    </div>

    <!-- Barra do Carrinho -->
    <div class="cart-bar">
        <div>
            <small>Total do Pedido:</small>
            <div style="font-size: 1.2rem; font-weight: bold;" id="cart-total">R$ 0,00</div>
        </div>
        <button class="checkout-btn" onclick="toggleModal(true)">Ver Pedido (<span id="cart-count">0</span>)</button>
    </div>

    <!-- Modal de Finalização -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seu Pedido</h2>
                <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            </div>

            <div id="cart-items-list"></div>

            <hr style="margin: 15px 0;">

            <form id="order-form" onsubmit="sendWhatsAppOrder(event)">
                <div class="form-group">
                    <label>Seu Nome:</label>
                    <input type="text" id="client-name" required placeholder="Digite seu nome">
                </div>
                <div class="form-group">
                    <label>Endereço de Entrega:</label>
                    <input type="text" id="client-address" required placeholder="Rua, número e bairro">
                </div>
                <div class="form-group">
                    <label>Forma de Pagamento:</label>
                    <select id="payment-method">
                        <option value="PIX">PIX</option>
                        <option value="Cartão de Crédito/Débito">Cartão (na entrega)</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                </div>
                <button type="submit" class="send-order-btn">Enviar Pedido via WhatsApp 🚀</button>
            </form>
        </div>
    </div>

    <script>
        // Configuração da Loja
        const TELEFONE_WHATSAPP = "5511968498721"; // Digite aqui o número do dono da loja com DDD

        // Banco de Dados de Produtos (Exemplo)
        const products = [
            { id: 1, name: "Hambúrguer Artesanal", category: "Lanches", description: "Pão brioche, 180g de carne, queijo cheddar e bacon.", price: 28.00 },
            { id: 2, name: "X-Salada Especial", category: "Lanches", description: "Hamburguer, queijo, alface, tomate e maionese caseira.", price: 20.00 },
            { id: 3, name: "Refrigerante Lata", category: "Bebidas", description: "Lata 350ml trincando de gelada.", price: 6.00 },
            { id: 4, name: "Suco Natural", category: "Bebidas", description: "Suco da fruta 500ml (Laranja ou Limão).", price: 9.00 },
            { id: 5, name: "Brownie com Sorvete", category: "Sobremesas", description: "Brownie de chocolate quente com bola de sorvete de creme.", price: 15.00 }
        ];

        let cart = [];

        // Renderizar Produtos
        function renderProducts(items) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            items.forEach(product => {
                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <span class="product-price">R$ ${product.price.toFixed(2)}</span>
                        </div>
                        <button class="add-btn" onclick="addToCart(${product.id})">+ Add</button>
                    </div>
                `;
            });
        }

        // Filtrar por Categoria
        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(category === 'todos') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        // Adicionar ao Carrinho
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const itemInCart = cart.find(item => item.id === productId);

            if (itemInCart) {
                itemInCart.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        // Atualizar Interface do Carrinho
        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);

            document.getElementById('cart-total').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('cart-count').innerText = count;

            // Atualiza lista do modal
            const list = document.getElementById('cart-items-list');
            list.innerHTML = cart.length === 0 ? '<p style="color:#64748b;">Seu carrinho está vazio.</p>' : '';
            
            cart.forEach(item => {
                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong> (x${item.quantity})
                        </div>
                        <div>R$ ${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                `;
            });
        }

        // Modal
        function toggleModal(show) {
            document.getElementById('checkout-modal').classList.toggle('active', show);
        }

        // Enviar Pedido no WhatsApp
        function sendWhatsAppOrder(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert("Adicione pelo menos um produto ao carrinho!");
                return;
            }

            const name = document.getElementById('client-name').value;
            const address = document.getElementById('client-address').value;
            const payment = document.getElementById('payment-method').value;

            let message = `*NOVO PEDIDO DE COMIDA* 🛍️\n\n`;
            message += `*Cliente:* ${name}\n`;
            message += `*Endereço:* ${address}\n`;
            message += `*Pagamento:* ${payment}\n\n`;
            message += `*ITENS:* \n`;

            cart.forEach(item => {
                message += `• ${item.name} (x${item.quantity}) - R$ ${(item.price * item.quantity).toFixed(2)}\n`;
            });

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            message += `\n*TOTAL: R$ ${total.toFixed(2)}*`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${TELEFONE_WHATSAPP}?text=${encodedMessage}`, '_blank');
        }

        // Inicialização
        renderProducts(products);
    </script>
</body>
</html>
